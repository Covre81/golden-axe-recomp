# Testes sem ROM: compila o GenesisRecomp, roda tests/test_*.py e a suíte
# CTest do motor. Só dispara quando muda algo que os testes leem.
name: tests

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tests/**"
      - "segagenesisrecomp"
      - ".gitmodules"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "game/**"
      - "tests/**"
      - "segagenesisrecomp"
      - ".gitmodules"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # Só o que recompilador e testes do motor usam; o --recursive puxaria s1disasm etc.
      - name: Submódulos do motor
        shell: bash
        run: |
          git submodule update --init --depth 1 segagenesisrecomp
          git -C segagenesisrecomp submodule update --init --depth 1 \
            external/m68k-recomp-core external/z80-recomp-core external/rbengine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python tests/run_all.py --engine
